context:
  version: "0.9.5"

package:
  name: pygtide
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pygtide/pygtide-${{ version }}.tar.gz
  sha256: 2d7f88b6cd83f28e38aecc19b9e2bdbdbfa6a32a85428ff92ec74c9d5c847407

build:
  skip: match(python, "<3.10")
  number: 2
  script:
    - if: win
      then:
        - set "AR=llvm-ar"
        - set "LIB=%PREFIX%\Library\lib;%BUILD_PREFIX%\Library\lib;%LIB%"
        # Pass legacy standard flag for Fortran compatibility
        - set "FFLAGS=%FFLAGS% -std=legacy"
        # flang (LLVM) needs an explicit linker on windows, or meson's compiler check fails
        - set "LD=lld-link"
        - set "FC_LD=lld-link"
        - set "CC_LD=lld-link"
        - '"%PYTHON%" -m pip install . -vv --no-build-isolation --no-deps || (if exist build_abi\meson-logs\meson-log.txt type build_abi\meson-logs\meson-log.txt & exit /b 1)'
      else:
        - unset MESON_BUILD_ROOT
        - unset MESON_SOURCE_ROOT
        - unset NINJA_STATUS
        - unset NINJA_LOG_PATH
        - unset MESONINTROSPECT
        - "$PYTHON -m pip install . -vv --no-build-isolation --no-deps"

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('fortran') }}
    - ${{ stdlib('c') }}
    - if: win
      then:
        - llvm-tools

  host:
    - python
    - pip
    - setuptools >=61
    - wheel
    - meson >=1.1.0
    - ninja
    - numpy >=1.21
    - if: win
      then:
        - libpgmath

  run:
    - python
    - numpy >=1.21
    - pandas

tests:
  - python:
      imports:
        - pygtide
      pip_check: true

about:
  homepage: https://github.com/hydrogeoscience/pygtide
  summary: A Python module and wrapper for ETERNA PREDICT to compute gravitational tides on Earth
  documentation: https://hydrogeo.science
  license: MPL-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - craigmillernz
    - hydrogeoscience
