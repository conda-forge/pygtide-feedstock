context:
  version: "0.9.7"

package:
  name: pygtide
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pygtide/pygtide-${{ version }}.tar.gz
  sha256: 15c0d86b3ec228d2846c8a16563d963502578a0bbaa3887c39fb98d9fea03dea

build:
  skip: match(python, "<3.10")
  number: 0
  script:
    - if: win
      then:
        - set "AR=llvm-ar"
        - set "LIB=%PREFIX%\Library\lib;%BUILD_PREFIX%\Library\lib;%LIB%"
        - set "FFLAGS=%FFLAGS% -fms-runtime-lib=static"
        - for /f "delims=" %%i in ('where /r "%BUILD_PREFIX%\Library\lib\clang" flang_rt.runtime.static.lib 2^>nul') do set "FLANG_LIB_DIR=%%~dpi"
        - if not defined FLANG_LIB_DIR (echo Flang static runtime library not found & exit /b 1)
        - set "FLANG_WINDOWS_LIB_DIR=%FLANG_LIB_DIR%..\windows"
        - set "LIB=%FLANG_WINDOWS_LIB_DIR%;%FLANG_LIB_DIR%;%LIB%"
        - set "LIBPATH=%FLANG_WINDOWS_LIB_DIR%;%FLANG_LIB_DIR%;%BUILD_PREFIX%\Library\lib;%LIBPATH%"
        # flang (LLVM) needs an explicit linker on windows, or meson's compiler check fails
        - set "LD=lld-link"
        - set "FC_LD=lld-link"
        - set "CC_LD=lld-link"
        - '"%PYTHON%" -m pip install . -vv --no-build-isolation --no-deps || (if exist build_abi\meson-logs\meson-log.txt type build_abi\meson-logs\meson-log.txt & exit /b 1)'
      else:
        - unset MESON_BUILD_ROOT
        - unset MESON_SOURCE_ROOT
        - unset NINJA_STATUS
        - unset NINJA_LOG_PATH
        - unset MESONINTROSPECT
        - "$PYTHON -m pip install . -vv --no-build-isolation --no-deps"

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('fortran') }}
    - ${{ stdlib('c') }}
    - if: win
      then:
        - llvm-tools

  host:
    - python
    - pip
    - setuptools >=61
    - wheel
    - meson >=1.1.0
    - ninja
    - numpy >=1.21
    - if: win
      then:
        - libpgmath

  run:
    - python
    - numpy >=1.21
    - pandas

tests:
  - python:
      imports:
        - pygtide
      pip_check: true

about:
  homepage: https://github.com/hydrogeoscience/pygtide
  summary: A Python module and wrapper for ETERNA PREDICT to compute gravitational tides on Earth
  documentation: https://hydrogeo.science
  license: MPL-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - craigmillernz
    - hydrogeoscience
